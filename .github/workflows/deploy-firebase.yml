name: Deploy Free Firebase Panel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build dashboard
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets['FIREBASE_SERVICE_ACCOUNT_JSON'] }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Hosting
        run: |
          npx firebase-tools@latest deploy --project fk-signal-hunter --only hosting --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
