name: Backend Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/exchangeHub.js
      - run: node --check src/signalEngine.js
      - run: node --check src/paperEngine.js
      - run: node --check src/backtestEngine.js
      - run: node --check src/historicalCollector.js
      - run: node --check src/historicalLoader.js
      - run: node --check src/walkForwardEngine.js
      - run: npm test
      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build
