name: Backend Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/exchangeHub.js
      - run: node --check src/signalEngine.js
      - run: node --check src/paperEngine.js
      - run: node --check src/backtestEngine.js
      - run: node --check src/historicalCollector.js
      - run: node --check src/historicalLoader.js
      - run: node --check src/walkForwardEngine.js
      - run: npm test
      - name: Verify Firebase Admin credentials
        run: |
          node --input-type=module -e 'import { FirebaseStore } from "./src/firebaseStore.js"; const store = new FirebaseStore(); if (!store.enabled) { console.error("Firebase credentials were not initialized"); process.exit(1); } console.log("Firebase Admin credentials initialized successfully");'
      # Firestore smoke test requires the Cloud Firestore API to be enabled.
      - name: Test Firestore read/write/delete
        run: |
          node --input-type=module -e 'import { FirebaseStore } from "./src/firebaseStore.js"; const store = new FirebaseStore(); await store.smokeTest(); console.log("Firestore smoke test passed: write, read and delete");'
      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build
