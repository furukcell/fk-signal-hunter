name: Feature Validation V2

on:
  push:
    branches:
      - feature/entry-engine-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package.json
            frontend/package-lock.json
      - name: Backend install
        working-directory: backend
        run: npm install
      - name: Backend syntax
        working-directory: backend
        run: node --check src/snapshotCollector.js
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Frontend install
        working-directory: frontend
        run: npm install
      - name: Frontend build
        working-directory: frontend
        run: npm run build
